<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="SecureOS gives teams a clear, secure workspace to manage users and account activity.">
    <title>SecureOS | User Management</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js for reports -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-theme">
    
    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>
    
    <!-- Loading Overlay -->
    <div id="global-loader" class="loader-overlay hidden">
        <div class="spinner"></div>
    </div>

    <!-- App Container -->
    <div id="app-container" class="app-container">
        <!-- Auth Layout -->
        <div id="auth-layout" class="layout auth-layout hidden">
            <!-- Dynamically injected auth views -->
        </div>

        <!-- Main Dashboard Layout -->
        <div id="main-layout" class="layout main-layout hidden">
            
            <!-- Sidebar -->
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <i class="fas fa-shield-alt logo-icon"></i>
                    <span class="logo-text">SecureOS</span>
                    <button id="mobile-close-btn" class="mobile-close-btn d-none">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                
                <div class="user-info-mini">
                    <div class="avatar" id="sidebar-avatar">
                        <!-- Image or Initials -->
                    </div>
                    <div class="details">
                        <span id="sidebar-username" class="username">Loading...</span>
                        <span id="sidebar-role" class="role badge">...</span>
                    </div>
                </div>

                <nav class="sidebar-nav">
                    <ul id="nav-menu">
                        <li class="nav-item" data-view="dashboard">
                            <a href="#dashboard" class="nav-link active">
                                <i class="fas fa-home"></i>
                                <span>Dashboard</span>
                            </a>
                        </li>
                        <li class="nav-item" data-view="profile">
                            <a href="#profile" class="nav-link">
                                <i class="fas fa-user"></i>
                                <span>Profile</span>
                            </a>
                        </li>
                        <li class="nav-item" data-view="notifications">
                            <a href="#notifications" class="nav-link">
                                <i class="fas fa-bell"></i>
                                <span>Notifications</span>
                                <span id="nav-notification-badge" class="badge bg-danger hidden">0</span>
                            </a>
                        </li>
                        
                        <!-- Admin Only Items -->
                        <li class="nav-header admin-only hidden">Administration</li>
                        <li class="nav-item admin-only hidden" data-view="users">
                            <a href="#users" class="nav-link">
                                <i class="fas fa-users-cog"></i>
                                <span>User Management</span>
                            </a>
                        </li>
                        <li class="nav-item admin-only hidden" data-view="reports">
                            <a href="#reports" class="nav-link">
                                <i class="fas fa-chart-bar"></i>
                                <span>Reports</span>
                            </a>
                        </li>
                    </ul>
                </nav>

                <div class="sidebar-footer">
                    <button id="theme-toggle" class="btn-icon" aria-label="Toggle color theme">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button id="logout-btn" class="btn-logout">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="main-content">
                <header class="top-header">
                    <button id="mobile-menu-btn" class="btn-icon mobile-only" aria-label="Open navigation menu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="header-title">
                        <h2 id="page-title">Dashboard</h2>
                    </div>
                    <div class="header-actions">
                        <button class="btn-icon notification-btn" onclick="app.navigate('notifications')" aria-label="Open notifications">
                            <i class="fas fa-bell"></i>
                            <span id="header-notification-badge" class="badge-dot hidden"></span>
                        </button>
                        <button class="profile-dropdown-trigger" onclick="app.navigate('profile')" aria-label="Open profile">
                            <div class="avatar small" id="header-avatar"></div>
                        </button>
                    </div>
                </header>

                <div id="view-container" class="view-container">
                    <!-- Views will be injected here by JS -->
                </div>
            </main>
        </div>
    </div>

    <!-- Templates -->
    
    <!-- Login View -->
    <template id="tpl-login">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <i class="fas fa-shield-alt fa-3x text-primary mb-3"></i>
                <h2>Welcome Back</h2>
                <p>Sign in to your account</p>
            </div>
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="login-email" required placeholder="name@example.com">
                    </div>
                </div>
                <div class="form-group">
                    <div class="d-flex justify-between">
                        <label for="login-password">Password</label>
                        <a href="#forgot-password" class="text-link small">Forgot Password?</a>
                    </div>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-password" required placeholder="Enter password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>
            <div class="auth-footer">
                <p>Don't have an account? <a href="#register" class="text-link">Register here</a></p>
            </div>
        </div>
    </template>

    <!-- Register View -->
    <template id="tpl-register">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Join our secure platform</p>
            </div>
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="reg-name" required placeholder="John Doe">
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="reg-email" required placeholder="name@example.com">
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="reg-password" required placeholder="Minimum 6 characters">
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-confirm">Confirm Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="reg-confirm" required placeholder="Re-enter password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>
            <div class="auth-footer">
                <p>Already have an account? <a href="#login" class="text-link">Sign in</a></p>
            </div>
        </div>
    </template>

    <!-- Forgot Password View -->
    <template id="tpl-forgot-password">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <h2>Reset Password</h2>
                <p>Enter your email to receive a reset link</p>
            </div>
            <form id="forgot-form" class="auth-form">
                <div class="form-group">
                    <label for="forgot-email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="forgot-email" required placeholder="name@example.com">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
            </form>
            <div class="auth-footer">
                <a href="#login" class="text-link"><i class="fas fa-arrow-left"></i> Back to login</a>
            </div>
        </div>
    </template>

    <!-- Reset Password View -->
    <template id="tpl-reset-password">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <h2>Set New Password</h2>
                <p>Please enter your new password below.</p>
            </div>
            <form id="reset-form" class="auth-form">
                <div class="form-group">
                    <label for="reset-password">New Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="reset-password" required placeholder="New Password">
                    </div>
                </div>
                <div class="form-group">
                    <label for="reset-confirm">Confirm Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="reset-confirm" required placeholder="Confirm Password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
            </form>
        </div>
    </template>

    <!-- Dashboard View -->
    <template id="tpl-dashboard">
        <div class="dashboard-view fade-in">
            <div class="welcome-banner card mb-4">
                <div class="banner-content">
                    <h1 id="dash-welcome">Welcome back!</h1>
                    <p>Here's what's happening with your account today.</p>
                </div>
                <div class="banner-img">
                    <i class="fas fa-chart-line fa-4x text-primary-light"></i>
                </div>
            </div>

            <!-- Admin Stats Row -->
            <div id="admin-stats-container" class="stats-grid mb-4 hidden">
                <div class="stat-card card">
                    <div class="stat-icon bg-primary-light">
                        <i class="fas fa-users text-primary"></i>
                    </div>
                    <div class="stat-details">
                        <h3>Total Users</h3>
                        <div class="stat-value" id="stat-total">0</div>
                    </div>
                </div>
                <div class="stat-card card">
                    <div class="stat-icon bg-success-light">
                        <i class="fas fa-check-circle text-success"></i>
                    </div>
                    <div class="stat-details">
                        <h3>Verified</h3>
                        <div class="stat-value" id="stat-verified">0</div>
                    </div>
                </div>
                <div class="stat-card card">
                    <div class="stat-icon bg-danger-light">
                        <i class="fas fa-times-circle text-danger"></i>
                    </div>
                    <div class="stat-details">
                        <h3>Unverified</h3>
                        <div class="stat-value" id="stat-unverified">0</div>
                    </div>
                </div>
                <div class="stat-card card">
                    <div class="stat-icon bg-warning-light">
                        <i class="fas fa-user-shield text-warning"></i>
                    </div>
                    <div class="stat-details">
                        <h3>Admins</h3>
                        <div class="stat-value" id="stat-admins">0</div>
                    </div>
                </div>
            </div>

            <div class="row">
                <!-- User Specific Content -->
                <div class="col-md-6 mb-4">
                    <div class="card h-100">
                        <div class="card-header">
                            <h3>Quick Actions</h3>
                        </div>
                        <div class="card-body">
                            <div class="action-grid">
                                <button class="action-btn" onclick="app.navigate('profile')">
                                    <i class="fas fa-user-edit"></i>
                                    <span>Edit Profile</span>
                                </button>
                                <button class="action-btn" onclick="app.navigate('notifications')">
                                    <i class="fas fa-envelope-open-text"></i>
                                    <span>Check Messages</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Admin Chart -->
                <div class="col-md-6 mb-4 admin-only hidden">
                    <div class="card h-100">
                        <div class="card-header">
                            <h3>Registration Overview</h3>
                        </div>
                        <div class="card-body">
                            <canvas id="registrationChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Profile View -->
    <template id="tpl-profile">
        <div class="profile-view fade-in">
            <div class="row">
                <div class="col-md-4 mb-4">
                    <div class="card text-center profile-card">
                        <div class="card-body">
                            <div class="profile-image-container relative mx-auto mb-3">
                                <div class="avatar large mx-auto" id="profile-page-avatar"></div>
                                <label for="profile-image-upload" class="image-upload-btn">
                                    <i class="fas fa-camera"></i>
                                </label>
                                <input type="file" id="profile-image-upload" class="hidden" accept="image/*">
                            </div>
                            <h3 id="profile-name-display">Loading...</h3>
                            <p class="text-muted" id="profile-email-display">...</p>
                            <span id="profile-role-badge" class="badge">...</span>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-8 mb-4">
                    <div class="card">
                        <div class="card-header">
                            <h3>Update Profile</h3>
                        </div>
                        <div class="card-body">
                            <form id="profile-form">
                                <div class="form-group">
                                    <label for="prof-name">Full Name</label>
                                    <input type="text" id="prof-name" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label for="prof-email">Email Address</label>
                                    <input type="email" id="prof-email" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </form>
                            
                            <hr class="my-4">
                            
                            <h3 class="mb-3">Change Password</h3>
                            <form id="password-form">
                                <div class="form-group">
                                    <label for="pwd-current">Current Password</label>
                                    <input type="password" id="pwd-current" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label for="pwd-new">New Password</label>
                                    <input type="password" id="pwd-new" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-outline-primary">Update Password</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Notifications View -->
    <template id="tpl-notifications">
        <div class="notifications-view fade-in">
            <div class="card">
                <div class="card-header d-flex justify-between align-items-center">
                    <h3>Your Notifications</h3>
                </div>
                <div class="card-body p-0">
                    <div id="notifications-list" class="list-group">
                        <!-- Items injected here -->
                    </div>
                    <div id="no-notifications" class="empty-state hidden">
                        <i class="fas fa-bell-slash fa-3x text-muted mb-3"></i>
                        <p>No notifications found.</p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Users Management View -->
    <template id="tpl-users">
        <div class="users-view fade-in admin-only">
            <div class="card">
                <div class="card-header d-flex justify-between align-items-center flex-wrap">
                    <h3>User Management</h3>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="user-search" placeholder="Search users..." aria-label="Search users">
                    </div>
                </div>
                <div class="card-body p-0 table-responsive">
                    <table class="table" id="users-table">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">User</th>
                                <th scope="col">Role</th>
                                <th scope="col">Email status</th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <!-- Rows -->
                        </tbody>
                    </table>
                </div>
                <div class="card-footer d-flex justify-between align-items-center">
                    <span id="page-info">Showing ...</span>
                    <div class="pagination">
                        <button id="btn-prev-page" class="btn btn-sm btn-outline"><i class="fas fa-chevron-left"></i></button>
                        <span id="current-page-display">1</span>
                        <button id="btn-next-page" class="btn btn-sm btn-outline"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Modal for Edit User -->
        <div id="user-modal" class="modal hidden">
            <div class="modal-content card">
                <div class="card-header d-flex justify-between align-items-center">
                    <h3>Edit User</h3>
                    <button class="close-modal btn-icon" id="close-user-modal"><i class="fas fa-times"></i></button>
                </div>
                <div class="card-body">
                    <form id="edit-user-form">
                        <input type="hidden" id="edit-user-id">
                        <div class="form-group">
                            <label for="edit-user-name">Name</label>
                            <input type="text" id="edit-user-name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="edit-user-email">Email</label>
                            <input type="email" id="edit-user-email" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </template>
    
    <!-- Reports View -->
    <template id="tpl-reports">
        <div class="reports-view fade-in admin-only">
            <div class="card mb-4">
                <div class="card-header">
                    <h3>Monthly Registrations</h3>
                </div>
                <div class="card-body">
                    <canvas id="reportsChart" height="100"></canvas>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Data Table</h3>
                </div>
                <div class="card-body p-0 table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Month</th>
                                <th>New Users</th>
                            </tr>
                        </thead>
                        <tbody id="reports-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <script src="js/app.js"></script>
</body>
</html>
